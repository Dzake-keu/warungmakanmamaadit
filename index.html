<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracker Tabungan</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }
    h2, h3 {
      margin-top: 0;
      color: #333;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    
    /* Style khusus untuk Password Wrapper dengan Tombol Mata */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrapper input {
      padding-right: 40px; /* Ruang untuk tombol mata */
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #777;
      padding: 0;
      margin: 0;
      width: auto;
    }
    .toggle-password:hover {
      background: none;
      color: #2ec4b6;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #2ec4b6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #20a396;
    }
    .switch-link {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }
    .switch-link a {
      color: #2ec4b6;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
    
    /* Header Profil */
    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
    }
    .profile-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar-wrapper {
      position: relative;
      cursor: pointer;
    }
    .avatar-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #2ec4b6;
    }
    .logout-btn {
      background: #ff5964;
      padding: 6px 12px;
      font-size: 12px;
      width: auto;
      margin: 0;
    }
    .logout-btn:hover {
      background: #e0434e;
    }
    
    /* Visual Indikator Tabungan */
    .jar-container {
      position: relative;
      width: 120px;
      height: 200px;
      border: 4px solid #333;
      border-radius: 20px;
      margin: 20px auto 15px;
      background: #eef2f5;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
    }
    .jar-container::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 6px;
      background: #333;
      border-radius: 4px 4px 0 0;
    }
    .jar-fill {
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, #2ec4b6, #0ff1ce);
      transition: height 0.5s ease-in-out;
    }
    .percentage-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 22px;
      font-weight: bold;
      color: #333;
      text-shadow: 0 0 5px rgba(255,255,255,0.8);
    }

    .stats {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .highlight {
      font-weight: bold;
      color: #2ec4b6;
    }

    /* Tabel Riwayat */
    .history-section {
      text-align: left;
      margin-top: 25px;
      border-top: 2px dashed #eee;
      padding-top: 15px;
    }
    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 10px;
    }
    .history-table th, .history-table td {
      padding: 8px 6px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    .history-table th {
      background-color: #f8f9fa;
      color: #666;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- CARD 1: FORM LOGIN -->
  <div class="card" id="loginCard">
    <h2>Masuk</h2>
    <div class="input-group">
      <label for="loginUser">Username:</label>
      <input type="text" id="loginUser" placeholder="Masukkan username">
    </div>
    <div class="input-group">
      <label for="loginPass">Password:</label>
      <div class="password-wrapper">
        <input type="password" id="loginPass" placeholder="Masukkan password">
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('loginPass', this)" title="Tampilkan/Sembunyikan Password">👁️</button>
      </div>
    </div>
    <button onclick="handleLogin()">Masuk</button>
    <div class="switch-link">
      Belum punya akun? <a onclick="showScreen('registerCard')">Buat Akun</a>
    </div>
  </div>

  <!-- CARD 2: FORM REGISTRASI -->
  <div class="card hidden" id="registerCard">
    <h2>Buat Akun Baru</h2>
    <div class="input-group">
      <label for="regUser">Username Baru:</label>
      <input type="text" id="regUser" placeholder="Pilih username">
    </div>
    <div class="input-group">
      <label for="regPass">Password:</label>
      <div class="password-wrapper">
        <input type="password" id="regPass" placeholder="Pilih password">
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('regPass', this)" title="Tampilkan/Sembunyikan Password">👁️</button>
      </div>
    </div>
    <button onclick="handleRegister()">Daftar</button>
    <div class="switch-link">
      Sudah punya akun? <a onclick="showScreen('loginCard')">Masuk</a>
    </div>
  </div>

  <!-- CARD 3: APLIKASI TABUNGAN -->
  <div class="card hidden" id="appCard">
    
    <!-- Profil Header -->
    <div class="user-header">
      <div class="profile-section">
        <div class="avatar-wrapper" onclick="document.getElementById('profileInput').click()" title="Klik untuk ganti foto profil">
          <img src="https://via.placeholder.com/50" id="profileImg" class="avatar-img" alt="Profil">
          <input type="file" id="profileInput" accept="image/*" style="display:none;" onchange="uploadProfilePic(event)">
        </div>
        <div style="text-align: left;">
          <div id="welcomeMsg" style="font-weight: bold; color: #333;">Halo!</div>
          <span style="font-size: 11px; color: #888;">Klik foto untuk ganti</span>
        </div>
      </div>
      <button class="logout-btn" onclick="handleLogout()">Keluar</button>
    </div>

    <h2>Tracker Tabungan</h2>
    
    <div class="input-group">
      <label for="target">Target Tabungan (Rp):</label>
      <input type="number" id="target" value="10000000">
    </div>

    <div class="input-group">
      <label for="current">Total Saldo Terkumpul (Rp):</label>
      <input type="number" id="current" value="1000000">
    </div>

    <div class="input-group">
      <label for="daily">Rencana Setoran Per Hari (Rp):</label>
      <input type="number" id="daily" value="50000">
    </div>

    <button onclick="saveAndCalculate()">Simpan & Update Visual</button>

    <!-- Visual Indikator -->
    <div class="jar-container">
      <div class="jar-fill" id="jarFill"></div>
      <div class="percentage-text" id="percentText">0%</div>
    </div>

    <div class="stats" id="statsOutput"></div>

    <!-- Section Riwayat Tabungan -->
    <div class="history-section">
      <h3>Riwayat Setoran</h3>
      <table class="history-table">
        <thead>
          <tr>
            <th>Waktu</th>
            <th>Setoran</th>
            <th>Total Saldo</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <!-- Riwayat akan dirender di sini -->
        </tbody>
      </table>
    </div>

  </div>

  <script>
    let activeUser = null;

    // Fungsi Toggle Intip Password
    function togglePasswordVisibility(inputId, button) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        button.innerText = '🙈'; // Ubah ikon ke mata tertutup
      } else {
        input.type = 'password';
        button.innerText = '👁️'; // Ubah ikon ke mata terbuka
      }
    }

    function showScreen(screenId) {
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('registerCard').classList.add('hidden');
      document.getElementById('appCard').classList.add('hidden');
      document.getElementById(screenId).classList.remove('hidden');
    }

    function getUsers() {
      return JSON.parse(localStorage.getItem('savings_users') || '{}');
    }

    function handleRegister() {
      const user = document.getElementById('regUser').value.trim();
      const pass = document.getElementById('regPass').value.trim();

      if (!user || !pass) {
        alert('Username dan Password tidak boleh kosong!');
        return;
      }

      const users = getUsers();
      if (users[user]) {
        alert('Username sudah terpakai!');
        return;
      }

      users[user] = {
        password: pass,
        profilePic: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user) + '&background=2ec4b6&color=fff',
        savingsData: { target: 10000000, current: 1000000, daily: 50000 },
        history: []
      };
      
      localStorage.setItem('savings_users', JSON.stringify(users));
      alert('Akun berhasil dibuat! Silakan login.');
      showScreen('loginCard');
    }

    function handleLogin() {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const users = getUsers();

      if (users[user] && users[user].password === pass) {
        activeUser = user;
        localStorage.setItem('active_session', user);
        loadUserData();
        showScreen('appCard');
      } else {
        alert('Username atau Password salah!');
      }
    }

    function handleLogout() {
      activeUser = null;
      localStorage.removeItem('active_session');
      showScreen('loginCard');
    }

    // Upload Foto Profil
    function uploadProfilePic(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Image = e.target.result;
        document.getElementById('profileImg').src = base64Image;

        const users = getUsers();
        if (users[activeUser]) {
          users[activeUser].profilePic = base64Image;
          localStorage.setItem('savings_users', JSON.stringify(users));
        }
      };
      reader.readAsDataURL(file);
    }

    function loadUserData() {
      const users = getUsers();
      const userData = users[activeUser];

      document.getElementById('welcomeMsg').innerText = activeUser;
      document.getElementById('profileImg').src = userData.profilePic || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(activeUser));

      if (userData.savingsData) {
        document.getElementById('target').value = userData.savingsData.target;
        document.getElementById('current').value = userData.savingsData.current;
        document.getElementById('daily').value = userData.savingsData.daily;
      }

      renderHistory(userData.history || []);
      updateSavings(false);
    }

    function saveAndCalculate() {
      const target = parseFloat(document.getElementById('target').value) || 0;
      const current = parseFloat(document.getElementById('current').value) || 0;
      const daily = parseFloat(document.getElementById('daily').value) || 0;

      const users = getUsers();
      const currentUserData = users[activeUser];
      const oldCurrent = currentUserData.savingsData ? currentUserData.savingsData.current : 0;

      if (current > oldCurrent) {
        const setoranNominal = current - oldCurrent;
        const now = new Date();
        const timeString = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) + ' ' + now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        if (!currentUserData.history) currentUserData.history = [];
        
        currentUserData.history.unshift({
          waktu: timeString,
          setoran: setoranNominal,
          total: current
        });
      }

      currentUserData.savingsData = { target, current, daily };
      localStorage.setItem('savings_users', JSON.stringify(users));

      renderHistory(currentUserData.history || []);
      updateSavings(true);
    }

    function renderHistory(historyList) {
      const historyBody = document.getElementById('historyBody');
      historyBody.innerHTML = '';

      if (historyList.length === 0) {
        historyBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#999;">Belum ada riwayat setoran</td></tr>`;
        return;
      }

      historyList.forEach(item => {
        const row = `
          <tr>
            <td>${item.waktu}</td>
            <td style="color:green; font-weight:bold;">+${formatRupiah(item.setoran)}</td>
            <td>${formatRupiah(item.total)}</td>
          </tr>
        `;
        historyBody.innerHTML += row;
      });
    }

    function formatRupiah(number) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
    }

    function updateSavings(showAlert = false) {
      const target = parseFloat(document.getElementById('target').value) || 0;
      const current = parseFloat(document.getElementById('current').value) || 0;
      const daily = parseFloat(document.getElementById('daily').value) || 0;

      if (target <= 0) {
        if (showAlert) alert("Target tabungan harus lebih dari 0!");
        return;
      }

      let percentage = (current / target) * 100;
      let displayPercentage = percentage.toFixed(1);
      if (percentage > 100) percentage = 100;

      document.getElementById('jarFill').style.height = percentage + '%';
      document.getElementById('percentText').innerText = displayPercentage + '%';

      const remaining = target - current;
      const statsOutput = document.getElementById('statsOutput');

      if (remaining <= 0) {
        statsOutput.innerHTML = `<span style="color: green; font-weight: bold;">Selamat! Target tabungan kamu sudah tercapai! 🎉</span>`;
      } else if (daily > 0) {
        const daysLeft = Math.ceil(remaining / daily);
        statsOutput.innerHTML = `
          Sisa target: <span class="highlight">${formatRupiah(remaining)}</span><br>
          Estimasi tercapai: <span class="highlight">${daysLeft} hari lagi</span> (± ${(daysLeft / 30).toFixed(1)} bulan).
        `;
      } else {
        statsOutput.innerHTML = `Sisa target: <span class="highlight">${formatRupiah(remaining)}</span>.`;
      }
    }

    window.onload = function() {
      const savedSession = localStorage.getItem('active_session');
      if (savedSession && getUsers()[savedSession]) {
        activeUser = savedSession;
        loadUserData();
        showScreen('appCard');
      } else {
        showScreen('loginCard');
      }
    };
  </script>

</body>
</html>
